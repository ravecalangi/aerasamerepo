<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="images/aera-favicon.svg"><title>Reseller Login | AERA</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Urbanist:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#384168;--deep:#242b4b;--paper:#fdf8f3;--line:rgba(56,65,104,.16);--muted:rgba(56,65,104,.68)}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px/1.55 "DM Sans",sans-serif;color:var(--ink)}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:auto;padding:0 24px;border-bottom:1px solid var(--line)}.brand{font:700 1.25rem Urbanist,sans-serif;letter-spacing:.15em;color:var(--deep);text-decoration:none}.nav a:last-child{color:var(--ink);text-decoration:none;font-size:.9rem}.wrap{width:min(960px,calc(100% - 32px));margin:0 auto;padding:clamp(48px,8vw,96px) 0}.auth{width:min(430px,100%);margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 10px 30px rgba(56,65,104,.05)}h1,h2{font-family:Urbanist,sans-serif;color:var(--deep)}h1{font-size:2.4rem;line-height:1;margin:0 0 10px}.muted{color:var(--muted)}label{display:block;margin-top:14px;font-size:.82rem;font-weight:600}input{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff;font:inherit;color:var(--ink)}button{margin-top:20px;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:13px 22px;font:600 .9rem inherit;cursor:pointer}.msg{min-height:22px;color:#a33;font-size:.9rem}.dashboard{display:none}.dashboard.show{display:block}.top{display:flex;justify-content:space-between;gap:20px;align-items:start;flex-wrap:wrap}.balance{background:var(--deep);color:#fff;border-radius:16px;padding:22px;min-width:230px}.balance span{display:block;font-size:.78rem;opacity:.75}.balance strong{font:600 2rem Urbanist,sans-serif}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:28px 0}.detail{padding:14px;border:1px solid var(--line);border-radius:12px}.detail span{display:block;color:var(--muted);font-size:.75rem}.history{width:100%;border-collapse:collapse}.history th,.history td{text-align:left;padding:11px 6px;border-bottom:1px solid var(--line);font-size:.85rem}@media(max-width:540px){.details{grid-template-columns:1fr}.history{font-size:.75rem}}</style></head><body><nav class="nav"><a class="brand" href="index.html">AERA</a><a href="circle.html">AERA Circle</a></nav><main class="wrap"><section class="auth card" id="auth"><h1>Reseller portal</h1><p class="muted">Sign in with credentials supplied by AERA. Customer checkout never requires this login.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button><p class="msg" id="msg" aria-live="polite"></p></form></section><section class="dashboard" id="dashboard"><div class="top"><div><p class="muted">AERA Circle reseller</p><h1 id="name"></h1><p id="business" class="muted"></p></div><div class="balance"><span>Current balance</span><strong id="balance">₱0.00</strong></div></div><div class="details"><div class="detail"><span>Email</span><strong id="dEmail"></strong></div><div class="detail"><span>Contact number</span><strong id="phone"></strong></div><div class="detail"><span>Address</span><strong id="address"></strong></div><div class="detail"><span>Account status</span><strong>Active</strong></div></div><div class="card"><h2>Balance history</h2><table class="history"><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Amount</th><th>Balance</th></tr></thead><tbody id="transactions"></tbody></table></div><button id="logout">Sign out</button></section></main><script>(function(){'use strict';var U=window.AERA_SUPABASE_URL||'https://vhyveinrqamzycixhjsu.supabase.co',K=window.AERA_SUPABASE_KEY||'sb_publishable_Bdq_PnkKKZfnoqwBkcqrAg_Np412yu3',API=U+'/functions/v1/aera-api',$=function(x){return document.getElementById(x)},token=sessionStorage.getItem('aera-reseller-token'),peso=function(n){return '₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})};function show(data){$('auth').style.display='none';$('dashboard').classList.add('show');$('name').textContent=data.profile.full_name;$('business').textContent=data.profile.business_name||'';$('balance').textContent=peso(data.balance);$('dEmail').textContent=data.email||'';$('phone').textContent=data.profile.contact_number||'—';$('address').textContent=data.profile.address||'—';$('transactions').innerHTML=(data.transactions||[]).map(function(t){return '<tr><td>'+new Date(t.created_at).toLocaleDateString('en-PH')+'</td><td>'+t.transaction_type+'</td><td>'+t.description+'</td><td>'+peso(t.amount)+'</td><td>'+peso(t.balance_after)+'</td></tr>'}).join('')||'<tr><td colspan="5">No balance transactions yet.</td></tr>'}function load(){if(!token)return;fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+token},body:JSON.stringify({action:'reseller-me'})}).then(function(r){return r.json().then(function(x){if(!r.ok)throw Error(x.error||'Unable to load account.');return x})}).then(show).catch(function(){sessionStorage.removeItem('aera-reseller-token');token=null})}$('login').onsubmit=function(e){e.preventDefault();$('msg').textContent='';fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':K},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})}).then(function(r){return r.json().then(function(x){if(!r.ok)throw Error('Invalid email or password.');return x})}).then(function(x){token=x.access_token;sessionStorage.setItem('aera-reseller-token',token);load()}).catch(function(err){$('msg').textContent=err.message})};$('logout').onclick=function(){sessionStorage.removeItem('aera-reseller-token');location.reload()};load()})();</script></body></html>
